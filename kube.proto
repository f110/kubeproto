syntax = "proto3";
package dev.f110.kubeproto;

import "google/protobuf/descriptor.proto";

enum Scope {
  SCOPE_NAMESPACED = 0;
  SCOPE_CLUSTER    = 1;
}

message Kind {
  repeated PrinterColumn additional_printer_columns = 1;
  Scope                  scope                      = 2;
}

// ListType is how the elements of a list are merged by Server-Side Apply.
enum ListType {
  LIST_TYPE_UNSPECIFIED = 0;
  // The list is owned as a whole.
  LIST_TYPE_ATOMIC = 1;
  // Each element is identified by the fields in list_map_keys.
  LIST_TYPE_MAP = 2;
  // Each element is identified by its value.
  LIST_TYPE_SET = 3;
}

// MapType is how the entries of a map are merged by Server-Side Apply.
enum MapType {
  MAP_TYPE_UNSPECIFIED = 0;
  MAP_TYPE_GRANULAR    = 1;
  MAP_TYPE_ATOMIC      = 2;
}

// StructType is how the fields of a message are merged by Server-Side Apply.
enum StructType {
  STRUCT_TYPE_UNSPECIFIED = 0;
  STRUCT_TYPE_GRANULAR    = 1;
  STRUCT_TYPE_ATOMIC      = 2;
}

message Field {
  string go_name          = 1;
  bool inline             = 2;
  bool     sub_resource   = 3;
  string   api_field_name = 4;
  ListType list_type      = 5;
  // list_map_keys is the names of the fields that identify an element.
  // This is used when list_type is LIST_TYPE_MAP.
  repeated string list_map_keys = 6;
  MapType         map_type      = 7;
}

message Message {
  StructType struct_type = 1;
}

message Kubernetes {
  // domain and sub_group are combined to the group
  // and combined the group and version are "apiVersion".
  // apiVersion is "${domain}.${sub_group}/${version}"
  string domain    = 1;
  string sub_group = 2;
  string version   = 3;
  bool   served    = 4;
  bool   storage   = 5;
}

message PrinterColumn {
  string description = 1;
  string name        = 2;
  string json_path   = 3;
  int32  priority    = 4;
  // In future, type and format field will remove.
  string type   = 5;
  string format = 6;
}

message EnumValue {
  string value = 1;
}

extend google.protobuf.MessageOptions {
  Kind    kind    = 60010;
  Message message = 60011;
}

extend google.protobuf.FieldOptions {
  Field field = 60010;
}

extend google.protobuf.FileOptions {
  Kubernetes k8s                  = 60010;
  string     kubeproto_go_package = 60011;
}

extend google.protobuf.EnumValueOptions {
  EnumValue value = 60010;
}
